<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Qui review qui ? Système de rotation de revue de code sur 3 semaines pour les développeurs Seniors et Juniors." />
    <title>Qui review qui ? - Planning de Code Review</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
    
    <link rel="icon" type="image/x-icon" href="favicon.png" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="container">
      <main>
        <div class="absence-panel" aria-labelledby="absence-title">
          <div class="absence-title" id="absence-title">Gestion des Absences</div>
          <div class="absence-buttons" id="absence-buttons" role="group" aria-label="Liste des participants pour basculer les absences"></div>
        </div>
        
        <div class="carousel-container">
          <button class="carousel-nav-btn prev-btn" id="carousel-prev" aria-label="Semaine précédente" disabled>
            <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
          </button>
          
          <div class="carousel-viewport" id="carousel-viewport">
            <div id="weeks-container" class="weeks-container">
              <!-- Les semaines seront générées ici par JavaScript -->
            </div>
          </div>
          
          <button class="carousel-nav-btn next-btn" id="carousel-next" aria-label="Semaine suivante">
            <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
          </button>
        </div>
        
        <div class="carousel-dots" id="carousel-dots"></div>
      </main>
    </div>

    <script src="app.js"></script>
  </body>
</html>
